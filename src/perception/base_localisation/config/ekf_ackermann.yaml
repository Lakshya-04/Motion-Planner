# Car-like base (Ackermann steering): body vx and yaw rate, no sideways motion. The wheel yaw rate comes from the
# steering angle and is poor at low speed, so the gyro matters most here. Lower rate and a longer sensor timeout than
# the others because these bases tend to publish odometry slowly. Not tuned on a car; the sim has no Ackermann base.
# State order of every *_config row: x y z roll pitch yaw vx vy vz vroll vpitch vyaw ax ay az.
ekf_filter_node:
  ros__parameters:
    frequency: 20.0
    sensor_timeout: 0.3
    two_d_mode: true
    publish_tf: true
    publish_acceleration: false
    print_diagnostics: false
    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom

    # expanded to the 15 x 15 process_noise_covariance by base_localisation.ekf_params; vy is pinned
    process_noise_diag: [0.05, 0.05, 1.0e-6, 1.0e-6, 1.0e-6, 0.02,
                         0.05, 1.0e-4, 1.0e-6, 1.0e-6, 1.0e-6, 0.01,
                         0.02, 0.02, 1.0e-6]

    odom0: /odom
    odom0_config: [false, false, false, false, false, false,
                   true,  false, false, false, false, true,
                   false, false, false]
    odom0_differential: false
    odom0_relative: false
    odom0_queue_size: 10

    imu0: /imu
    imu0_config: [false, false, false, false, false, false,
                  false, false, false, false, false, true,
                  false, false, false]
    imu0_differential: false
    imu0_relative: false
    imu0_queue_size: 20
    imu0_remove_gravitational_acceleration: false

    odom1: /scan_odom
    odom1_config: [false, false, false, false, false, false,
                   true,  false, false, false, false, true,
                   false, false, false]
    odom1_differential: false
    odom1_relative: false
    odom1_queue_size: 10
