controller_manager:
  ros__parameters:
    update_rate: 100

    combined_arm_lift_controller:
      type: compliant_trajectory_controller/JtacController

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

# combined_arm_lift_controller keeps its production name so 7dof_moveit_controllers_combined
# .yaml (which points MoveIt's TrajectoryExecutionManager at "combined_arm_lift_controller/
# follow_joint_trajectory") needs zero changes -- only this controller's `type:` differs from the
# production combined_arm_lift_controllers.yaml this is otherwise a drop-in replacement for.
#
# robot_description is deliberately NOT set here: JtacController reads it via admittance_
# controller::ParamListener, which lives on THIS controller's own node, not on /controller_manager
# -- passing it through this static YAML would require the full xacro render baked in ahead of
# time. Instead it is injected at spawn time via the spawner's --param-file (see
# jtac_controller_test.launch.py's own _write_robot_description_param_file()), matching the fix
# already named in force_control_backend_admittance_vs_diffik.md's Phase 2 step 4.
combined_arm_lift_controller:
  ros__parameters:
    joints:
      - lift_prismatic_joint
      - joint1
      - joint2
      - joint3
      - joint4
      - joint5
      - joint6
    command_interfaces:
      - position
      - velocity
    state_interfaces:
      - position
      - velocity

    # link_tcp, not link6: this test's xacro render includes add_other_geometry (the mop tool),
    # so link_tcp is the real controlled point -- CLAUDE.md's own convention, and the same choice
    # jtac_compliance_demo.launch.py's real-robot branch already made for the same reason.
    kinematics:
      plugin_name: kinematics_interface_kdl/KinematicsInterfaceKDL
      plugin_package: kinematics_interface
      base: base_link
      tip: link_tcp
      alpha: 0.0005

    ft_sensor:
      name: uf_ft_sensor
      # 1.0 == pass-through -- this test's own injected wrench is already the "measurement" to
      # exercise, no reason to also smooth it, matching T4a's/T6's own convention.
      filter_coefficient: 1.0
      frame:
        id: link_tcp

    control:
      frame:
        id: link_tcp

    fixed_world_frame:
      frame:
        id: base_link

    gravity_compensation:
      frame:
        id: link_tcp
      CoG:
        pos: [0.0, 0.0, 0.0]
        # Must stay 0.0: UFACTORY's ft_ext_force already removes payload/gravity -- see
        # force_control_backend_admittance_vs_diffik.md's tool_profiles.yaml landmine list.
        force: 0.0

    # Diagnostic gains -- NOT mop's shipped production values. Only Z selected: a push along the
    # tool's own local Z is the wall-contact case (CLAUDE.md/wall_penetration_check.hpp's "tool
    # +Z = outward wall normal" convention).
    #
    # Mass is 4x T4a's/T6's own proven-stable diagnostic values (X/Y: 4.0, Z: 2.0), NOT the same
    # numbers -- found the hard way, live, under this real controller: T4a/T6 only ever validate
    # AdmittanceRule::update() against a STATIC reference (reference never moves; only the
    # measured-force-driven deflection does). Driving a REAL, MOVING FollowJointTrajectory goal
    # through this controller for the first time reproduced the exact discrete-instability
    # signature T4a's own AdmittanceRuleUnconditionallyDivergesAtMopsShippedGains regression
    # documents (desired-velocity alternating sign, growing ~1.3-2x/cycle) at T4a's own "stable"
    # mass values, with ZERO applied force -- purely from following an ordinary joint-space
    # trajectory. The M > K*(zeta*dt)^2 bound was derived (and only ever empirically checked)
    # against a motionless reference; a moving reference's own tracking error apparently erodes
    # that margin by more than the ~28% headroom T4a's own diagnostic values (M=4.0 against a
    # M_min=3.125 requirement) provided. 4x mass cleared it with margin in this live test; this is
    # an empirical safety factor, not a re-derived bound -- re-tightening it needs the same kind
    # of derivation T4a's own comment walks through, generalized to a nonzero reference velocity
    # term, not just picking a bigger number that happened to work once.
    admittance:
      # Starts with every axis deselected -- the same "no force obligation" default
      # ForceStage::kNone and PickNik's own admittance_parameters_no_admittance.yaml preset use
      # (see force_control_backend_admittance_vs_diffik.md's T7 section). A real per-segment
      # engage()/disengage() (JtacControllerCompliancePort) flips these live -- see the flag below.
      selected_axes: [false, false, false, false, false, false]
      mass: [16.0, 16.0, 8.0, 0.5, 0.5, 0.5]
      damping_ratio: [5.59, 5.59, 6.0, 1.0, 1.0, 1.0]
      stiffness: [1000.0, 1000.0, 300.0, 50.0, 50.0, 50.0]
      joint_damping: 5.0

    # Required for JtacControllerCompliancePort's engage()/disengage() to work at all:
    # AdmittanceRule::update() only calls its own apply_parameters_update() -- which is what
    # picks up a live ros2 param set on admittance.mass/stiffness/damping_ratio/selected_axes/
    # control.frame.id -- when this is true (verified against the installed admittance_rule_impl
    # .hpp: the check gates the call at the top of every update() cycle). No controller code is
    # needed for live reconfiguration; this one flag is the entire mechanism.
    enable_parameter_update_without_reactivation: true
