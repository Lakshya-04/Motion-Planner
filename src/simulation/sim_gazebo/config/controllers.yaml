# Loaded by the gz_ros2_control plugin inside the gz server (the plugin owns the
# controller_manager). Joint lists are NOT here: sim.launch.py generates them from the
# description profile and passes them to each spawner with --param-file.
controller_manager:
  ros__parameters:
    update_rate: 200
    use_sim_time: true

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    force_torque_sensor_broadcaster:
      type: force_torque_sensor_broadcaster/ForceTorqueSensorBroadcaster

    joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    # the JTAC controller keeps the name the existing demos and MoveIt configs use
    combined_arm_lift_controller:
      type: compliant_trajectory_controller/JtacController
