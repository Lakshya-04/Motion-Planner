# Profile: generic 6-DOF arm on a 0.386 m torso lift (telescopic, stages 0) on a Fetch-style round differential base.
robot:
  name: mobile_manipulator
  xacro_args:
    arm: generic_6dof
    base: fetch_style
    lift_stroke: 0.386
    lift_stages: 0
    lift_max_velocity: 0.05
    tcp_xyz: "0 0 0.165"

groups:
  arm: arm
  whole_body: lift_arm
  tool: tool

arm:
  dof: 6
  controller_family: generic_6dof

frames:
  world_base: base_footprint
  base: base_link
  lift_base: lift_base_link
  lift_output: lift_output_link
  arm_base: arm_base_link
  flange: arm_flange_link
  tool_mount: tool_mount_link
  tcp: tcp_link

joints:
  lift: lift_joint
  arm: [arm_joint1, arm_joint2, arm_joint3, arm_joint4, arm_joint5, arm_joint6]
  mimic: []

lift:
  type: telescopic
  stroke_m: 0.386
  max_velocity_mps: 0.05
  stages: 0
  max_acceleration_mps2: 0.5
  mount_height_m: 0.43   # lift_output_link above lift_base_link, retracted

home:
  lift_joint: 0.2
  arm_joint1: 0.0
  arm_joint2: -1.5708
  arm_joint3: 1.5708
  arm_joint4: -1.5708
  arm_joint5: -1.5708
  arm_joint6: 0.0

# Mobile base. Numbers are nominal (approximate public spec sheets); check them against your unit.
base:
  name: fetch_style
  description: "Fetch-style round differential base (nominal values)"
  drive_type: diff          # omni | diff | skid | 4ws
  can_strafe: false
  # Rectangle in base_footprint (x forward, y left, metres) enclosing body, wheels and casters.
  footprint:
    - [-0.2800, -0.2800]
    - [0.2800, -0.2800]
    - [0.2800, 0.2800]
    - [-0.2800, 0.2800]
  wheel_radius_m: 0.0605
  track_m: 0.3748
  wheelbase_m: null
  max_linear_velocity_mps: 1.0
  max_angular_velocity_radps: 2.0
  max_linear_acceleration_mps2: 0.5
  max_angular_acceleration_radps2: 1.0
  arm_mount_xy: [0.0, 0.0]      # arm base in base_footprint (x, y); stationing places the footprint by it
  lift_mount_height_m: 0.3     # lift_mount_link above base_footprint
  ground_clearance_m: 0.04
  mass_kg: 70.0
