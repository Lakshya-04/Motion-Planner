# Profile: FR3 7-DOF on a 0.35 m torso lift (telescopic, stages 0) on a TIAGo-style round differential base.
robot:
  name: mobile_manipulator
  xacro_args:
    arm: fr3
    base: tiago_style
    lift_stroke: 0.35
    lift_stages: 0
    lift_max_velocity: 0.05
    tcp_xyz: "0 0 0.1034"

groups:
  arm: arm
  whole_body: lift_arm
  tool: tool

arm:
  dof: 7
  controller_family: arm7

frames:
  world_base: base_footprint
  base: base_link
  lift_base: lift_base_link
  lift_output: lift_output_link
  arm_base: arm_base_link
  flange: arm_flange_link
  tool_mount: tool_mount_link
  tcp: tcp_link

joints:
  lift: lift_joint
  arm: [arm_joint1, arm_joint2, arm_joint3, arm_joint4, arm_joint5, arm_joint6, arm_joint7]
  mimic: []

lift:
  type: telescopic
  stroke_m: 0.35
  max_velocity_mps: 0.05
  stages: 0
  max_acceleration_mps2: 0.5
  mount_height_m: 0.57   # lift_output_link above lift_base_link, retracted

# Ready posture, lift part way up. Not checked for self-collision on this arm in a simulator.
home:
  lift_joint: 0.15
  arm_joint1: 0.0
  arm_joint2: -0.7854
  arm_joint3: 0.0
  arm_joint4: -2.3562
  arm_joint5: 0.0
  arm_joint6: 1.5708
  arm_joint7: 0.7854

# Mobile base. Numbers are nominal (approximate public spec sheets); check them against your unit.
base:
  name: tiago_style
  description: "TIAGo-style round differential base (nominal values)"
  drive_type: diff          # omni | diff | skid | 4ws
  can_strafe: false
  # Rectangle in base_footprint (x forward, y left, metres) enclosing body, wheels and casters.
  footprint:
    - [-0.2700, -0.2700]
    - [0.2700, -0.2700]
    - [0.2700, 0.2700]
    - [-0.2700, 0.2700]
  wheel_radius_m: 0.0985
  track_m: 0.4044
  wheelbase_m: null
  max_linear_velocity_mps: 1.0
  max_angular_velocity_radps: 1.0
  max_linear_acceleration_mps2: 0.5
  max_angular_acceleration_radps2: 1.0
  arm_mount_xy: [0.0, 0.0]      # arm base in base_footprint (x, y); stationing places the footprint by it
  lift_mount_height_m: 0.3     # lift_mount_link above base_footprint
  ground_clearance_m: 0.04
  mass_kg: 60.0
