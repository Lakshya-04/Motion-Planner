# Profile: generic 6-DOF arm on a Stretch-style mast lift (1.10 m, one carriage, 0.2 m/s) on a small round base. Numbers: docs/lift_catalog.md.
robot:
  name: mobile_manipulator
  xacro_args:
    arm: generic_6dof
    base: turtlebot3_waffle
    lift_stroke: 1.1
    lift_stages: 0
    lift_max_velocity: 0.2
    tcp_xyz: "0 0 0.165"

groups:
  arm: arm
  whole_body: lift_arm
  tool: tool

arm:
  dof: 6
  controller_family: generic_6dof

frames:
  world_base: base_footprint
  base: base_link
  lift_base: lift_base_link
  lift_output: lift_output_link
  arm_base: arm_base_link
  flange: arm_flange_link
  tool_mount: tool_mount_link
  tcp: tcp_link

joints:
  lift: lift_joint
  arm: [arm_joint1, arm_joint2, arm_joint3, arm_joint4, arm_joint5, arm_joint6]
  mimic: []

lift:
  type: telescopic
  stroke_m: 1.1
  max_velocity_mps: 0.2
  stages: 0
  max_acceleration_mps2: 0.5
  mount_height_m: 0.1   # lift_output_link above lift_base_link, retracted
  payload_kg: 1.5        # note only: not used by the model
  # stroke and speed: RE1 spec sheet; mount height is approximate

home:
  lift_joint: 0.5
  arm_joint1: 0.0
  arm_joint2: -1.5708
  arm_joint3: 1.5708
  arm_joint4: -1.5708
  arm_joint5: -1.5708
  arm_joint6: 0.0

# Mobile base. Numbers are nominal (published spec sheets); check them against your unit.
base:
  name: turtlebot3_waffle
  description: "TurtleBot3 Waffle: small differential base for CI and demos"
  drive_type: diff          # omni | diff | skid | 4ws
  can_strafe: false
  # Rectangle in base_footprint (x forward, y left, metres) enclosing body, wheels and casters.
  footprint:
    - [-0.1405, -0.1525]
    - [0.1405, -0.1525]
    - [0.1405, 0.1525]
    - [-0.1405, 0.1525]
  wheel_radius_m: 0.033
  track_m: 0.287
  wheelbase_m: null
  max_linear_velocity_mps: 0.26
  max_angular_velocity_radps: 1.82
  max_linear_acceleration_mps2: 0.5
  max_angular_acceleration_radps2: 2.0
  arm_mount_xy: [0.0, 0.0]      # arm base in base_footprint (x, y); stationing places the footprint by it
  lift_mount_height_m: 0.141     # lift_mount_link above base_footprint
  ground_clearance_m: 0.01
  mass_kg: 1.8
