# Profile: Kinova Gen3 7-DOF on a short pedestal (no lift) on a Clearpath Jackal-style four-wheel differential base.
robot:
  name: mobile_manipulator
  xacro_args:
    arm: kinova_gen3
    base: jackal
    tcp_xyz: "0 0 0.15"

groups:
  arm: arm
  whole_body: lift_arm
  tool: tool

arm:
  dof: 7
  controller_family: arm7

frames:
  world_base: base_footprint
  base: base_link
  lift_base: lift_base_link
  lift_output: lift_output_link
  arm_base: arm_base_link
  flange: arm_flange_link
  tool_mount: tool_mount_link
  tcp: tcp_link

joints:
  lift: null            # no actuated lift
  arm: [arm_joint1, arm_joint2, arm_joint3, arm_joint4, arm_joint5, arm_joint6, arm_joint7]
  mimic: []

lift:
  type: none
  mount_height_m: 0.05  # lift_output_link (arm base) above the lift mount: the pedestal height

# Ready posture (no lift). Not checked for self-collision on this arm in a simulator.
home:
  arm_joint1: 0.0
  arm_joint2: 0.2618
  arm_joint3: 3.1416
  arm_joint4: -2.2689
  arm_joint5: 0.0
  arm_joint6: 0.9599
  arm_joint7: 1.5708

# Mobile base. Numbers are nominal (approximate public spec sheets); check them against your unit.
base:
  name: jackal
  description: "Clearpath Jackal: four-wheel differential (skid) drive"
  drive_type: diff          # omni | diff | skid | 4ws
  can_strafe: false
  # Rectangle in base_footprint (x forward, y left, metres) enclosing body, wheels and casters.
  footprint:
    - [-0.2540, -0.2150]
    - [0.2540, -0.2150]
    - [0.2540, 0.2150]
    - [-0.2540, 0.2150]
  wheel_radius_m: 0.098
  track_m: 0.37559
  wheelbase_m: 0.262
  max_linear_velocity_mps: 2.0
  max_angular_velocity_radps: 4.0
  max_linear_acceleration_mps2: 1.0
  max_angular_acceleration_radps2: 2.0
  arm_mount_xy: [0.0, 0.0]      # arm base in base_footprint (x, y); stationing places the footprint by it
  lift_mount_height_m: 0.25     # lift_mount_link above base_footprint
  ground_clearance_m: 0.065
  mass_kg: 17.0

# Sensors on the base: typical add-ons unless factory is true. Mounts are in base_link
# (body box centre, x forward). See docs/base_catalog.md for what is verified.
sensors:
  - type: lidar2d
    name: lidar
    frame: lidar_link
    mount: {xyz: [0.18, 0.0, 0.14], rpy: [0.0, 0.0, 0.0]}
    factory: false
    source: "Hokuyo UST-10LX, https://www.hokuyo-aut.jp/search/single.php?serial=167 (mount is an integrator choice)"
    spec:
      angle_min_rad: -2.35619
      angle_max_rad: 2.35619
      angle_increment_rad: 0.00436332
      range_min_m: 0.06
      range_max_m: 10.0
      rate_hz: 40.0              # 25 ms per scan
      range_noise_std_m: 0.03    # repeatability sigma < 30 mm, an upper bound
