# Profile: UR10e mounted directly on the base (no lift). The lift contract links still exist, so
# everything downstream is unchanged; lift_joint is a fixed joint and the planning group lift_arm
# is the same six joints as arm.
robot:
  name: mobile_manipulator
  xacro_args:
    arm: ur10e
    tcp_xyz: "0 0 0.165"

frames:
  world_base: base_footprint
  base: base_link
  lift_base: lift_base_link
  lift_output: lift_output_link
  arm_base: arm_base_link
  flange: arm_flange_link
  tool_mount: tool_mount_link
  tcp: tcp_link

joints:
  lift: null            # no actuated lift
  arm:
    - arm_shoulder_pan_joint
    - arm_shoulder_lift_joint
    - arm_elbow_joint
    - arm_wrist_1_joint
    - arm_wrist_2_joint
    - arm_wrist_3_joint
  mimic: []

lift:
  type: none
  mount_height_m: 0.32  # lift_output_link (arm base) above the lift mount: the pedestal height

home:
  arm_shoulder_pan_joint: 0.0
  arm_shoulder_lift_joint: -1.5708
  arm_elbow_joint: 1.5708
  arm_wrist_1_joint: -1.5708
  arm_wrist_2_joint: -1.5708
  arm_wrist_3_joint: 0.0
