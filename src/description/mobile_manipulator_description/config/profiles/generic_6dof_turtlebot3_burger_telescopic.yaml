# Profile: generic_6dof arm on the telescopic lift, mounted on TurtleBot3 Burger: small differential base for CI and demos.
robot:
  name: mobile_manipulator
  xacro_args:
    arm: generic_6dof
    base: turtlebot3_burger
    lift_stroke: 1.5
    lift_stages: 2
    lift_max_velocity: 0.2
    tcp_xyz: "0 0 0.165"

frames:
  world_base: base_footprint
  base: base_link
  lift_base: lift_base_link
  lift_output: lift_output_link
  arm_base: arm_base_link
  flange: arm_flange_link
  tool_mount: tool_mount_link
  tcp: tcp_link

joints:
  lift: lift_joint
  arm: [arm_joint1, arm_joint2, arm_joint3, arm_joint4, arm_joint5, arm_joint6]
  mimic: [lift_stage_1_joint, lift_stage_2_joint]

lift:
  type: telescopic
  stroke_m: 1.5
  max_velocity_mps: 0.2
  stages: 2

home:
  lift_joint: 0.4
  arm_joint1: 0.0
  arm_joint2: -1.5708
  arm_joint3: 1.5708
  arm_joint4: -1.5708
  arm_joint5: -1.5708
  arm_joint6: 0.0

# Mobile base. Numbers are nominal (published spec sheets); check them against your unit.
base:
  name: turtlebot3_burger
  description: "TurtleBot3 Burger: small differential base for CI and demos"
  drive_type: diff          # omni | diff | skid | 4ws
  can_strafe: false
  # Rectangle in base_footprint (x forward, y left, metres) enclosing body, wheels and casters.
  footprint:
    - [-0.0910, -0.0890]
    - [0.0690, -0.0890]
    - [0.0690, 0.0890]
    - [-0.0910, 0.0890]
  wheel_radius_m: 0.033
  track_m: 0.16
  wheelbase_m: null
  max_linear_velocity_mps: 0.22
  max_angular_velocity_radps: 2.84
  max_linear_acceleration_mps2: 0.5
  max_angular_acceleration_radps2: 2.0
  arm_mount_xy: [0.0, 0.0]      # arm base in base_footprint (x, y); stationing places the footprint by it
  lift_mount_height_m: 0.192     # lift_mount_link above base_footprint
  ground_clearance_m: 0.01
  mass_kg: 1.0

# Sensors on the base: typical add-ons unless factory is true. Mounts are in base_link
# (body box centre, x forward). See docs/base_catalog.md for what is verified.
sensors:
  - type: lidar2d
    name: lidar
    frame: base_scan
    mount: {xyz: [-0.032, 0.0, 0.13], rpy: [0.0, 0.0, 0.0]}
    factory: true
    source: "ROBOTIS LDS-01 specifications, https://emanual.robotis.com/docs/en/platform/turtlebot3/appendix_lds_01/ (mount is an integrator choice)"
    spec:
      angle_min_rad: 0.0
      angle_max_rad: 6.28319
      angle_increment_rad: 0.0174533
      range_min_m: 0.12
      range_max_m: 3.5
      rate_hz: 5.0               # 300 +/- 10 rpm
