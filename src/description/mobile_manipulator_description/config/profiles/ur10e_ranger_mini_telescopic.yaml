# Profile: ur10e arm on the telescopic lift, mounted on AgileX Ranger Mini 2.0: four-wheel steering (omni / Ackermann / spin).
robot:
  name: mobile_manipulator
  xacro_args:
    arm: ur10e
    base: ranger_mini
    lift_stroke: 1.5
    lift_stages: 2
    lift_max_velocity: 0.2
    tcp_xyz: "0 0 0.165"

frames:
  world_base: base_footprint
  base: base_link
  lift_base: lift_base_link
  lift_output: lift_output_link
  arm_base: arm_base_link
  flange: arm_flange_link
  tool_mount: tool_mount_link
  tcp: tcp_link

# Actuated joints in kinematic order (7-DOF planning chain: lift first, then the arm).
joints:
  lift: lift_joint
  arm:
    - arm_shoulder_pan_joint
    - arm_shoulder_lift_joint
    - arm_elbow_joint
    - arm_wrist_1_joint
    - arm_wrist_2_joint
    - arm_wrist_3_joint
  # Followed through <mimic>, never commanded.
  mimic:
    - lift_stage_1_joint
    - lift_stage_2_joint

lift:
  type: telescopic
  stroke_m: 1.5
  max_velocity_mps: 0.2
  stages: 2

# A safe, collision-free configuration with the arm folded (lift, then arm joints in order).
home:
  lift_joint: 0.4
  arm_shoulder_pan_joint: 0.0
  arm_shoulder_lift_joint: -1.5708
  arm_elbow_joint: 1.5708
  arm_wrist_1_joint: -1.5708
  arm_wrist_2_joint: -1.5708
  arm_wrist_3_joint: 0.0

# Mobile base. Numbers are nominal (published spec sheets); check them against your unit.
base:
  name: ranger_mini
  description: "AgileX Ranger Mini 2.0: four-wheel steering (omni / Ackermann / spin)"
  drive_type: 4ws          # omni | diff | skid | 4ws
  can_strafe: true
  # Rectangle in base_footprint (x forward, y left, metres) enclosing body, wheels and casters.
  footprint:
    - [-0.3690, -0.2485]
    - [0.3690, -0.2485]
    - [0.3690, 0.2485]
    - [-0.3690, 0.2485]
  wheel_radius_m: 0.0825
  track_m: 0.364
  wheelbase_m: 0.494
  max_linear_velocity_mps: 1.5
  max_angular_velocity_radps: 1.5
  max_linear_acceleration_mps2: 1.0
  max_angular_acceleration_radps2: 2.0
  # Drive modes. Source: AgileX RANGER MINI 2.0 User Manual V2.0.1 (2023.08), spec table (min turning radius
  # 0 mm spin, 810 mm Ackermann; 5.4 km/h = 1.5 m/s) and the CAN motion-control frame (linear speed +-1.5 m/s,
  # +-0.75 m/s once the steering angle is above 20 deg; spin +-3.259 rad/s; oblique mode steers up to 90 deg).
  # The radius is taken at base_footprint (the manual does not say where it is measured). Accelerations are
  # not in the manual, so the modes inherit the profile's nominal ones (unverified).
  modes:
    - name: ackermann
      default: true
      min_turn_radius_m: 0.81
      max_linear_mps: 1.5
      max_linear_turning_mps: 0.75
    - name: crab               # the manual's "oblique" mode
      max_linear_mps: 0.75     # sideways needs a steering angle above 20 deg
    - name: spin
      max_angular_radps: 3.259
  arm_mount_xy: [0.0, 0.0]      # arm base in base_footprint (x, y); stationing places the footprint by it
  lift_mount_height_m: 0.264     # lift_mount_link above base_footprint
  ground_clearance_m: 0.04
  mass_kg: 70.0
