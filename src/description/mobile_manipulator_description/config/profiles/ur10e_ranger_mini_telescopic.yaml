# Profile: ur10e arm on the telescopic lift, mounted on AgileX Ranger Mini 2.0: four-wheel steering (omni / Ackermann / spin).
robot:
  name: mobile_manipulator
  xacro_args:
    arm: ur10e
    base: ranger_mini
    lift_stroke: 1.5
    lift_stages: 2
    lift_max_velocity: 0.2
    tcp_xyz: "0 0 0.165"

frames:
  world_base: base_footprint
  base: base_link
  lift_base: lift_base_link
  lift_output: lift_output_link
  arm_base: arm_base_link
  flange: arm_flange_link
  tool_mount: tool_mount_link
  tcp: tcp_link

# Actuated joints in kinematic order (7-DOF planning chain: lift first, then the arm).
joints:
  lift: lift_joint
  arm:
    - arm_shoulder_pan_joint
    - arm_shoulder_lift_joint
    - arm_elbow_joint
    - arm_wrist_1_joint
    - arm_wrist_2_joint
    - arm_wrist_3_joint
  # Followed through <mimic>, never commanded.
  mimic:
    - lift_stage_1_joint
    - lift_stage_2_joint

lift:
  type: telescopic
  stroke_m: 1.5
  max_velocity_mps: 0.2
  stages: 2

# A safe, collision-free configuration with the arm folded (lift, then arm joints in order).
home:
  lift_joint: 0.4
  arm_shoulder_pan_joint: 0.0
  arm_shoulder_lift_joint: -1.5708
  arm_elbow_joint: 1.5708
  arm_wrist_1_joint: -1.5708
  arm_wrist_2_joint: -1.5708
  arm_wrist_3_joint: 0.0

# Mobile base. Numbers are nominal (published spec sheets); check them against your unit.
base:
  name: ranger_mini
  description: "AgileX Ranger Mini 2.0: four-wheel steering (omni / Ackermann / spin)"
  drive_type: 4ws          # omni | diff | skid | 4ws
  can_strafe: true
  # Rectangle in base_footprint (x forward, y left, metres) enclosing body, wheels and casters.
  footprint:
    - [-0.3690, -0.2485]
    - [0.3690, -0.2485]
    - [0.3690, 0.2485]
    - [-0.3690, 0.2485]
  wheel_radius_m: 0.0825
  track_m: 0.364
  wheelbase_m: 0.494
  max_linear_velocity_mps: 1.5
  max_angular_velocity_radps: 1.5
  max_linear_acceleration_mps2: 1.0
  max_angular_acceleration_radps2: 2.0
  arm_mount_xy: [0.0, 0.0]      # arm base in base_footprint (x, y); stationing places the footprint by it
  lift_mount_height_m: 0.264     # lift_mount_link above base_footprint
  ground_clearance_m: 0.04
  mass_kg: 70.0

# Sensors on the base: typical add-ons unless factory is true. Mounts are in base_link
# (body box centre, x forward). See docs/base_catalog.md for what is verified.
sensors:
  - type: lidar2d
    name: lidar
    frame: lidar_link
    mount: {xyz: [0.30, 0.0, 0.16], rpy: [0.0, 0.0, 0.0]}
    factory: false
    source: "Hokuyo UST-10LX, https://www.hokuyo-aut.jp/search/single.php?serial=167 (mount is an integrator choice)"
    spec:
      angle_min_rad: -2.35619
      angle_max_rad: 2.35619
      angle_increment_rad: 0.00436332
      range_min_m: 0.06
      range_max_m: 10.0
      rate_hz: 40.0              # 25 ms per scan
      range_noise_std_m: 0.03    # repeatability sigma < 30 mm, an upper bound
  - type: rgbd
    name: front_camera
    frame: front_camera_link
    mount: {xyz: [0.33, 0.0, 0.22], rpy: [0.0, 0.0, 0.0]}
    factory: false
    source: "Intel RealSense D455, https://www.realsenseai.com/products/stereo-depth-camera-d455/ (mount is an integrator choice)"
    spec:
      width: 1280
      height: 720
      hfov_rad: 1.51844
      range_min_m: 0.52
      range_max_m: 6.0
      rate_hz: 30.0              # the page says up to 90 fps; 30 is a typical stream setting
      depth_noise_note: "depth accuracy under 2 percent at 4 m (vendor page)"
