# Profile: xArm7 on a short pedestal (no lift) on a Clearpath Dingo-O-style four-mecanum omnidirectional base.
robot:
  name: mobile_manipulator
  xacro_args:
    arm: xarm7
    base: dingo_o
    tcp_xyz: "0 0 0.17"

groups:
  arm: arm
  whole_body: lift_arm
  tool: tool

arm:
  dof: 7
  controller_family: arm7

frames:
  world_base: base_footprint
  base: base_link
  lift_base: lift_base_link
  lift_output: lift_output_link
  arm_base: arm_base_link
  flange: arm_flange_link
  tool_mount: tool_mount_link
  tcp: tcp_link

joints:
  lift: null            # no actuated lift
  arm: [arm_joint1, arm_joint2, arm_joint3, arm_joint4, arm_joint5, arm_joint6, arm_joint7]
  mimic: []

lift:
  type: none
  mount_height_m: 0.05  # lift_output_link (arm base) above the lift mount: the pedestal height

# Ready posture (no lift). Not checked for self-collision on this arm in a simulator.
home:
  arm_joint1: 0.0
  arm_joint2: -0.5
  arm_joint3: 0.0
  arm_joint4: 1.0
  arm_joint5: 0.0
  arm_joint6: 1.5
  arm_joint7: 0.0

# Mobile base. Numbers are nominal (approximate public spec sheets); check them against your unit.
base:
  name: dingo_o
  description: "Clearpath Dingo-O: four mecanum wheels (omnidirectional)"
  drive_type: omni          # omni | diff | skid | 4ws
  can_strafe: true
  # Rectangle in base_footprint (x forward, y left, metres) enclosing body, wheels and casters.
  footprint:
    - [-0.2530, -0.2320]
    - [0.2530, -0.2320]
    - [0.2530, 0.2320]
    - [-0.2530, 0.2320]
  wheel_radius_m: 0.05
  track_m: 0.404
  wheelbase_m: 0.3
  max_linear_velocity_mps: 1.1
  max_angular_velocity_radps: 2.0
  max_linear_acceleration_mps2: 1.0
  max_angular_acceleration_radps2: 2.0
  arm_mount_xy: [0.0, 0.0]      # arm base in base_footprint (x, y); stationing places the footprint by it
  lift_mount_height_m: 0.172     # lift_mount_link above base_footprint
  ground_clearance_m: 0.052
  mass_kg: 17.0

# Sensors on the base: typical add-ons unless factory is true. Mounts are in base_link
# (body box centre, x forward). See docs/base_catalog.md for what is verified.
sensors:
  - type: lidar2d
    name: lidar
    frame: lidar_link
    mount: {xyz: [0.18, 0.0, 0.11], rpy: [0.0, 0.0, 0.0]}
    factory: false
    source: "Slamtec RPLIDAR A2M8 datasheet v1.0, https://cdn.sparkfun.com/assets/e/a/f/9/8/LD208_SLAMTEC_rplidar_datasheet_A2M8_v1.0_en.pdf (mount is an integrator choice)"
    spec:
      angle_min_rad: 0.0
      angle_max_rad: 6.28319
      angle_increment_rad: 0.015708
      range_min_m: 0.15
      range_max_m: 8.0
      rate_hz: 10.0
