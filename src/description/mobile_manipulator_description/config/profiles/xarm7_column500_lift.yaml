# Profile: xArm 7 on a 0.5 m 2-stage 24 V lifting column (70x70 mm tube, about 30 mm/s) on a skid-steer base. Numbers: docs/lift_catalog.md.
robot:
  name: mobile_manipulator
  xacro_args:
    arm: xarm7
    base: scout_mini
    lift_stroke: 0.5
    lift_stages: 2
    lift_max_velocity: 0.03
    tcp_xyz: "0 0 0.17"

groups:
  arm: arm
  whole_body: lift_arm
  tool: tool

arm:
  dof: 7
  controller_family: arm7

frames:
  world_base: base_footprint
  base: base_link
  lift_base: lift_base_link
  lift_output: lift_output_link
  arm_base: arm_base_link
  flange: arm_flange_link
  tool_mount: tool_mount_link
  tcp: tcp_link

joints:
  lift: lift_joint
  arm: [arm_joint1, arm_joint2, arm_joint3, arm_joint4, arm_joint5, arm_joint6, arm_joint7]
  mimic: [lift_stage_1_joint, lift_stage_2_joint]

lift:
  type: telescopic
  stroke_m: 0.5
  max_velocity_mps: 0.03
  stages: 2
  max_acceleration_mps2: 0.2
  mount_height_m: 0.645   # lift_output_link above lift_base_link, retracted
  payload_kg: 70        # note only: not used by the model
  # datasheet: two-stage, 700 N push load (about 70 kg, push only), 30 mm/s at full load, 645 mm retracted

# Ready posture, lift part way up. Not checked for self-collision on this arm in a simulator.
home:
  lift_joint: 0.25
  arm_joint1: 0.0
  arm_joint2: -0.5
  arm_joint3: 0.0
  arm_joint4: 1.0
  arm_joint5: 0.0
  arm_joint6: 1.5
  arm_joint7: 0.0

# Mobile base. Numbers are nominal (published spec sheets); check them against your unit.
base:
  name: scout_mini
  description: "AgileX Scout Mini: four-wheel skid steer"
  drive_type: skid          # omni | diff | skid | 4ws
  can_strafe: false
  # Rectangle in base_footprint (x forward, y left, metres) enclosing body, wheels and casters.
  footprint:
    - [-0.3190, -0.2618]
    - [0.3190, -0.2618]
    - [0.3190, 0.2618]
    - [-0.3190, 0.2618]
  wheel_radius_m: 0.0875
  track_m: 0.4535
  wheelbase_m: 0.463
  max_linear_velocity_mps: 1.7
  max_angular_velocity_radps: 2.0
  max_linear_acceleration_mps2: 1.0
  max_angular_acceleration_radps2: 2.0
  arm_mount_xy: [0.0, 0.0]      # arm base in base_footprint (x, y); stationing places the footprint by it
  lift_mount_height_m: 0.235     # lift_mount_link above base_footprint
  ground_clearance_m: 0.107
  mass_kg: 23.0
